name: Publish cf-global New API image

on:
  push:
    branches:
      - cf-global-newapi
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/401825317/new-api

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify recovery and drain paths
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
          go test ./common ./model ./middleware ./controller ./relay/channel/openai ./service ./logger \
            -run 'TestReleaseDrain|TestResponsesRecovery' -count=3 -timeout 180s
          go test ./common ./model ./middleware ./controller ./relay/channel/openai ./service ./logger \
            -run 'TestReleaseDrain|TestResponsesRecovery' \
            -skip 'TestResponsesRecoveryFullRelay/[^/]+/OfficialBaseline' \
            -race -count=1 -timeout 180s

      - name: Write immutable build version
        run: echo "cf-global-newapi-${GITHUB_SHA::12}" > VERSION

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:cf-global-newapi-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=cf-global-newapi-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Inspect published image
        run: docker buildx imagetools inspect "${IMAGE}:cf-global-newapi-${GITHUB_SHA}"
