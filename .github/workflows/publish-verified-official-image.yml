name: Publish verified official New API image

on:
  push:
    branches:
      - feauter/newapi-official-rc27-image
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Copy the verified upstream amd64 manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/401825317/new-api:official-v1.0.0-rc.27-amd64 \
            docker.io/calciumion/new-api@sha256:33927e105a03bce2ad5bbcd82ec25ba261f123499b8b7d533848491a1a5fcafa

      - name: Verify the published image
        run: |
          docker buildx imagetools inspect \
            ghcr.io/401825317/new-api:official-v1.0.0-rc.27-amd64
